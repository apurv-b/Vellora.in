<style>
:root{
  --ivory:#F8F6F2;
  --beige:#E8DED1;
  --gold:#C9A96A;
  --gold-deep:#A7823E;
  --charcoal:#2B2B2B;
  --white:#FFFFFF;
  --blush:#F1E4DC;
  --ink-soft:#6b6560;
  --shadow-soft: 0 20px 60px rgba(43,43,43,0.08);
  --shadow-lift: 0 30px 70px rgba(43,43,43,0.16);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:var(--ivory);
  color:var(--charcoal);
  line-height:1.6;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Playfair Display',serif;font-weight:600;color:var(--charcoal);}
a{text-decoration:none;color:inherit;}
img{max-width:100%;display:block;}
ul{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
.container{max-width:1240px;margin:0 auto;padding:0 32px;}
.eyebrow{
  font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);font-weight:600;display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--gold);display:inline-block;}
.section-title{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.01em;margin-bottom:14px;}
.section-sub{color:var(--ink-soft);font-size:16px;max-width:560px;margin-bottom:48px;}
.section{padding:110px 0;position:relative;}
.section.alt{background:var(--white);}
.fade-up{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease), transform .9s var(--ease);}
.fade-up.in{opacity:1;transform:translateY(0);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 30px;border-radius:100px;font-size:14px;font-weight:600;letter-spacing:.02em;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
  white-space:nowrap;
}
.btn-primary{background:var(--charcoal);color:var(--white);box-shadow:0 12px 30px rgba(43,43,43,.22);}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(43,43,43,.3);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--white);box-shadow:0 12px 30px rgba(169,130,62,.3);}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(169,130,62,.4);}
.btn-outline{border:1.5px solid var(--charcoal);color:var(--charcoal);}
.btn-outline:hover{background:var(--charcoal);color:var(--white);}
.btn-outline.on-dark{border-color:rgba(255,255,255,.5);color:var(--white);}
.btn-outline.on-dark:hover{background:var(--white);color:var(--charcoal);}

/* ---------- Ribbon Signature Divider ---------- */
.ribbon-divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto;width:fit-content;}
.ribbon-divider .line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
.ribbon-divider .line.r{background:linear-gradient(90deg,var(--gold),transparent);}
.ribbon-divider svg{width:22px;height:22px;flex-shrink:0;}

/* ---------- Scroll progress ---------- */
#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));z-index:9999;width:0%;transition:width .1s linear;}

/* ---------- Nav ---------- */
header{
  position:fixed;top:3px;left:0;right:0;z-index:900;
  background:rgba(248,246,242,.7);backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid rgba(43,43,43,.06);
  transition:background .4s, box-shadow .4s, padding .4s;
}
header.scrolled{background:rgba(248,246,242,.92);box-shadow:0 8px 30px rgba(0,0,0,.05);}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;max-width:1240px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:24px;letter-spacing:.02em;font-weight:700;}
.logo .mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;color:var(--white);font-size:14px;font-family:'Playfair Display',serif;}
.nav-links{display:flex;gap:34px;align-items:center;}
.nav-links a{font-size:14px;font-weight:500;position:relative;padding:6px 0;color:var(--charcoal);}
.nav-links a::after{content:"";position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--gold-deep);transition:width .35s var(--ease);}
.nav-links a:hover::after{width:100%;}
.nav-actions{display:flex;align-items:center;gap:18px;}
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .3s;color:var(--charcoal);}
.icon-btn:hover{background:var(--beige);}
.icon-btn svg{width:19px;height:19px;}
.badge{position:absolute;top:-2px;right:-2px;background:var(--gold-deep);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.burger{display:none;width:38px;height:38px;align-items:center;justify-content:center;}
.burger span{display:block;width:20px;height:1.5px;background:var(--charcoal);position:relative;}
.burger span::before,.burger span::after{content:"";position:absolute;width:20px;height:1.5px;background:var(--charcoal);left:0;}
.burger span::before{top:-6px;}
.burger span::after{top:6px;}

/* ---------- Hero ---------- */
.hero{
  min-height:100vh;display:flex;align-items:center;position:relative;
  padding:150px 0 80px;
  background:
    radial-gradient(ellipse at 80% 10%, rgba(201,169,106,.18), transparent 55%),
    radial-gradient(ellipse at 10% 90%, rgba(232,222,209,.6), transparent 55%),
    var(--ivory);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(43,43,43,.035) 1px,transparent 1px);
  background-size:26px 26px;mask-image:radial-gradient(ellipse at 60% 40%, black, transparent 70%);
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:70px;align-items:center;position:relative;z-index:2;}
.hero-logo-badge{
  display:inline-flex;align-items:center;gap:12px;background:var(--white);padding:10px 20px 10px 10px;
  border-radius:100px;box-shadow:var(--shadow-soft);margin-bottom:34px;
}
.hero-logo-badge .mark{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Playfair Display',serif;font-size:16px;}
.hero-logo-badge span{font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--ink-soft);}
.hero h1{font-size:clamp(40px,5.4vw,72px);line-height:1.08;letter-spacing:-.02em;margin-bottom:22px;}
.hero h1 em{font-style:italic;color:var(--gold-deep);}
.hero p.lead{font-size:18px;color:var(--ink-soft);max-width:480px;margin-bottom:38px;}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:46px;}
.hero-stats{display:flex;gap:40px;}
.hero-stats div{border-left:1px solid var(--beige);padding-left:16px;}
.hero-stats strong{display:block;font-family:'Playfair Display',serif;font-size:26px;}
.hero-stats span{font-size:12px;color:var(--ink-soft);letter-spacing:.03em;}
.hero-visual{position:relative;aspect-ratio:4/5;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lift);
  background:linear-gradient(155deg,var(--beige),var(--blush) 60%,var(--gold) 140%);
}
.hero-visual .ph-label{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:rgba(43,43,43,.55);text-align:center;padding:30px;
}
.hero-visual .ph-label svg{width:52px;height:52px;opacity:.6;}
.hero-visual .ph-label strong{font-family:'Playfair Display',serif;font-size:18px;color:rgba(43,43,43,.7);}
.hero-visual .ph-label small{font-size:12px;letter-spacing:.04em;}
.hero-visual .float-card{
  position:absolute;bottom:24px;left:24px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  padding:14px 18px;border-radius:16px;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:12px;
  animation:float 5s ease-in-out infinite;
}
.hero-visual .float-card svg{width:22px;height:22px;color:var(--gold-deep);}
.hero-visual .float-card b{display:block;font-size:13px;}
.hero-visual .float-card small{font-size:11px;color:var(--ink-soft);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-soft);font-size:11px;letter-spacing:.1em;z-index:3;}
.scroll-cue .stick{width:1px;height:34px;background:linear-gradient(var(--gold),transparent);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

/* ---------- Why choose grid ---------- */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.why-card{
  background:var(--white);border-radius:var(--radius-md);padding:32px 26px;box-shadow:var(--shadow-soft);
  transition:transform .4s var(--ease), box-shadow .4s var(--ease);
}
.why-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lift);}
.why-card .ic{width:48px;height:48px;border-radius:14px;background:var(--blush);display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--gold-deep);}
.why-card .ic svg{width:22px;height:22px;}
.why-card h3{font-size:16px;margin-bottom:8px;font-weight:600;font-family:'Inter',sans-serif;}
.why-card p{font-size:13.5px;color:var(--ink-soft);}

/* ---------- Occasion cards ---------- */
.occasion-scroller{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
.occasion-card{
  position:relative;border-radius:var(--radius-md);overflow:hidden;aspect-ratio:3/4;cursor:pointer;
  box-shadow:var(--shadow-soft);transition:transform .5s var(--ease), box-shadow .5s var(--ease);
}
.occasion-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:var(--shadow-lift);}
.occasion-card .bg{position:absolute;inset:0;transition:transform .6s var(--ease);}
.occasion-card:hover .bg{transform:scale(1.08);}
.occasion-card .overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(43,43,43,.78) 0%,rgba(43,43,43,.05) 55%);}
.occasion-card .ph-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);}
.occasion-card .ph-icon svg{width:34px;height:34px;}
.occasion-card .info{position:absolute;bottom:0;left:0;right:0;padding:22px;color:#fff;}
.occasion-card .info small{font-size:11px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;}
.occasion-card .info h3{color:#fff;font-size:19px;margin:4px 0 2px;}
.occ-1 .bg{background:linear-gradient(145deg,#e7c9c0,#c9a96a);}
.occ-2 .bg{background:linear-gradient(145deg,#d8c7b0,#8a6f4e);}
.occ-3 .bg{background:linear-gradient(145deg,#e8ded1,#a7823e);}
.occ-4 .bg{background:linear-gradient(145deg,#f1e4dc,#c9a96a);}
.occ-5 .bg{background:linear-gradient(145deg,#d9b98a,#6b5637);}
.occ-6 .bg{background:linear-gradient(145deg,#e0c9a6,#3f3226);}
.occ-7 .bg{background:linear-gradient(145deg,#efd9c8,#b98a55);}
.occ-8 .bg{background:linear-gradient(145deg,#ead9c9,#2b2b2b);}

/* ---------- Budget filter ---------- */
.budget-pills{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;}
.pill{
  padding:13px 24px;border-radius:100px;border:1.5px solid var(--beige);background:var(--white);
  font-size:13.5px;font-weight:600;color:var(--charcoal);transition:all .3s var(--ease);
}
.pill:hover{border-color:var(--gold);}
.pill.active{background:var(--charcoal);color:#fff;border-color:var(--charcoal);}

/* ---------- AI Gift Finder ---------- */
.finder-wrap{
  background:linear-gradient(155deg,var(--charcoal),#1c1c1c);border-radius:var(--radius-lg);padding:64px;color:#fff;
  position:relative;overflow:hidden;
}
.finder-wrap::before{content:"";position:absolute;top:-100px;right:-100px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,106,.28),transparent 70%);}
.finder-head{max-width:520px;margin-bottom:40px;position:relative;z-index:2;}
.finder-head .eyebrow{color:var(--gold);}
.finder-head h2{color:#fff;}
.finder-head p{color:rgba(255,255,255,.65);margin-top:12px;}
.finder-body{display:grid;grid-template-columns:1fr 1fr;gap:40px;position:relative;z-index:2;}
.finder-q label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px;}
.finder-q select, .finder-q input{
  width:100%;padding:15px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#fff;font-size:14px;margin-bottom:22px;font-family:'Inter',sans-serif;
}
.finder-q select option{color:#000;}
.finder-q input::placeholder{color:rgba(255,255,255,.4);}
#finder-result{
  margin-top:28px;padding:24px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  display:none;position:relative;z-index:2;
}
#finder-result.show{display:block;}
#finder-result h4{color:var(--gold);font-size:15px;margin-bottom:8px;}
#finder-result p{color:rgba(255,255,255,.8);font-size:14px;}

/* ---------- Product cards ---------- */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
.product-card{
  background:var(--white);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-soft);
  transition:transform .5s var(--ease), box-shadow .5s var(--ease);
}
.product-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lift);}
.product-media{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,var(--beige),var(--blush));overflow:hidden;}
.product-media .lid{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(43,43,43,.4);
  transition:transform .5s var(--ease);
}
.product-card:hover .product-media .lid{transform:translateY(-6px);}
.product-media svg{width:30px;height:30px;}
.wish-btn{
  position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;transition:transform .3s, background .3s;z-index:2;
}
.wish-btn svg{width:16px;height:16px;transition:fill .3s, stroke .3s;}
.wish-btn.active svg{fill:var(--gold-deep);stroke:var(--gold-deep);}
.wish-btn:hover{transform:scale(1.1);}
.product-info{padding:20px;}
.product-info .cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;}
.product-info h3{font-size:16px;margin:6px 0 4px;font-family:'Playfair Display',serif;}
.product-info .stars{color:var(--gold);font-size:12px;margin-bottom:8px;}
.product-info .desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;min-height:32px;}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.price-row .price{font-family:'Playfair Display',serif;font-size:19px;}
.price-row .price small{font-size:12px;color:var(--ink-soft);text-decoration:line-through;margin-left:6px;}
.product-actions{display:flex;gap:8px;}
.product-actions button{flex:1;padding:11px;border-radius:10px;font-size:12.5px;font-weight:600;}
.add-cart-btn{background:var(--beige);color:var(--charcoal);transition:background .3s;}
.add-cart-btn:hover{background:var(--gold);color:#fff;}
.buy-now-btn{background:var(--charcoal);color:#fff;transition:background .3s;}
.buy-now-btn:hover{background:var(--gold-deep);}

/* ---------- Custom hampers timeline ---------- */
.timeline{position:relative;max-width:820px;margin:0 auto;}
.timeline::before{content:"";position:absolute;left:29px;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--gold),var(--beige));}
.tl-item{display:flex;gap:26px;margin-bottom:42px;position:relative;}
.tl-item:last-child{margin-bottom:0;}
.tl-num{
  width:60px;height:60px;border-radius:50%;background:var(--white);border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:20px;
  color:var(--gold-deep);flex-shrink:0;position:relative;z-index:2;box-shadow:var(--shadow-soft);
}
.tl-text{padding-top:10px;}
.tl-text h3{font-size:18px;margin-bottom:6px;}
.tl-text p{color:var(--ink-soft);font-size:14px;max-width:460px;}

/* ---------- Corporate ---------- */
.corp-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
.corp-list{display:flex;flex-direction:column;gap:18px;margin:30px 0 36px;}
.corp-list li{display:flex;gap:14px;align-items:flex-start;font-size:14.5px;}
.corp-list li svg{width:18px;height:18px;color:var(--gold-deep);flex-shrink:0;margin-top:2px;}
.form-card{background:var(--white);border-radius:var(--radius-lg);padding:40px;box-shadow:var(--shadow-soft);}
.form-card h3{font-size:20px;margin-bottom:22px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:12px;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;padding:13px 15px;border:1px solid var(--beige);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;background:var(--ivory);
}
.field textarea{resize:vertical;min-height:90px;}
.form-card .btn{width:100%;margin-top:6px;}

/* ---------- Affiliate ---------- */
.earn-wrap{background:linear-gradient(155deg,var(--blush),var(--beige));border-radius:var(--radius-lg);padding:64px;}
.earn-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:36px 0 46px;}
.earn-step{background:rgba(255,255,255,.6);border-radius:var(--radius-md);padding:26px;backdrop-filter:blur(6px);}
.earn-step .n{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-deep);margin-bottom:10px;}
.earn-step h4{font-size:15px;margin-bottom:6px;}
.earn-step p{font-size:13px;color:var(--ink-soft);}
.earn-panels{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.earn-card{background:var(--white);border-radius:var(--radius-md);padding:28px;box-shadow:var(--shadow-soft);}
.earn-card h4{font-size:15px;margin-bottom:14px;}
.commission-box{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--beige);font-size:13.5px;}
.commission-box:last-child{border-bottom:none;}
.commission-box b{color:var(--gold-deep);}
.ref-link-gen{display:flex;gap:10px;margin-top:12px;}
.ref-link-gen input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--beige);font-size:12.5px;background:var(--ivory);color:var(--ink-soft);}
.dash-placeholder{border:1.5px dashed var(--gold);border-radius:12px;padding:26px;text-align:center;color:var(--ink-soft);font-size:13px;margin-top:14px;}

/* ---------- Gallery ---------- */
.gallery-grid{columns:4;column-gap:18px;}
.gallery-item{
  break-inside:avoid;margin-bottom:18px;border-radius:16px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,var(--beige),var(--blush));d
